stages:
  - prepare
  - build
  - package
  - dockerize

# Unique OS builder images (1 job per OS, independent of USER)
.builder_matrix: &builder_matrix
  - IMAGE: "ubuntu:24.04"
    IMAGE_TAG: "ubuntu-24.04"
  - IMAGE: "debian:13"
    IMAGE_TAG: "debian-13"

# Reusable matrix of (USER, IMAGE, IMAGE_TAG) targets
.target_matrix: &target_matrix
  - USER: [salas]
    IMAGE: ["ubuntu:24.04"]
    IMAGE_TAG: ["ubuntu-24.04"]
  - USER: [hgm]
    IMAGE: ["ubuntu:24.04"]
    IMAGE_TAG: ["ubuntu-24.04"]
  - USER: [hgm]
    IMAGE: ["debian:13"]
    IMAGE_TAG: ["debian-13"]
  - USER: [opt]
    IMAGE: ["ubuntu:24.04"]
    IMAGE_TAG: ["ubuntu-24.04"]

# Independent tools (all compile concurrently per USER/IMAGE)
.standalone_tools: &standalone_tools
  - "yosys"
  - "ghdl"
  - "nvc"
  - "yavs"
  - "icestorm"
  - "verilator"
  - "iverilog"

# 0. Prepare stage: build and cache OS dependency images once per distro
prepare_builders:
  stage: prepare
  image: docker:25
  timeout: 1 hour
  parallel:
    matrix: *builder_matrix
  script:
    - BUILDER_IMAGE="$CI_REGISTRY_IMAGE/builder:$IMAGE_TAG"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$BUILDER_IMAGE" || true
    - >
      docker build
      --cache-from "$BUILDER_IMAGE"
      --build-arg BASE_IMAGE="$IMAGE"
      -f Dockerfile.builder
      -t "$BUILDER_IMAGE" .
    - docker push "$BUILDER_IMAGE"

.build_tool_template:
  stage: build
  image: $CI_REGISTRY_IMAGE/builder:$IMAGE_TAG
  timeout: 6 hours
  needs:
    - job: prepare_builders
      parallel:
        matrix:
          - IMAGE: '$[[ matrix.IMAGE ]]'
            IMAGE_TAG: '$[[ matrix.IMAGE_TAG ]]'
  script:
    - |
      if [[ "$IS_WEEKLY" == "true" ]]; then
        cp "config-weekly-$USER.mk" config.mk
      else
        cp "config-$USER.mk" config.mk
      fi
    # Read PREFIX from config.mk and symlink it to $CI_PROJECT_DIR/fosshdl
    # so compiled-in paths match PREFIX while GitLab can archive fosshdl/
    - PREFIX=$(make -s --eval='print-prefix:; @echo $(PREFIX)' print-prefix)
    - mkdir -p "$CI_PROJECT_DIR/fosshdl" "$(dirname "$PREFIX")"
    - ln -sfn "$CI_PROJECT_DIR/fosshdl" "$PREFIX"
    # Filter $TOOLS against what is actually enabled in this USER's config.mk
    - CONFIG_SELECTED=$(make -s --eval='print-selected:; @echo $(selected)' print-selected)
    - |
      ACTIVE_TOOLS=""
      for t in $TOOLS; do
        case " $CONFIG_SELECTED " in
          *" $t "*) ACTIVE_TOOLS="$ACTIVE_TOOLS $t" ;;
        esac
      done
    - JOB_TAG=$(echo "$TOOLS" | tr ' ' '_')
    - LOG_FILE="fosshdl-$IMAGE-$USER-$JOB_TAG-$CI_PIPELINE_CREATED_AT-build.log"
    - |
      if [[ -z "$ACTIVE_TOOLS" ]]; then
        echo "Skipping '$TOOLS' (not enabled in config.mk)" | tee "$LOG_FILE"
      else
        set -o pipefail
        make SUDO= selected="$ACTIVE_TOOLS" VERSION_LOG="$PREFIX/versions-$JOB_TAG.log" install 2>&1 | tee "$LOG_FILE"
      fi
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - fosshdl/
      - fosshdl-$IMAGE-$USER-*-$CI_PIPELINE_CREATED_AT-build.log

# 1. Standalone tools
build_standalone:
  extends: .build_tool_template
  parallel:
    matrix:
      - USER: [salas]
        IMAGE: ["ubuntu:24.04"]
        IMAGE_TAG: ["ubuntu-24.04"]
        TOOLS: *standalone_tools
      - USER: [hgm]
        IMAGE: ["ubuntu:24.04"]
        IMAGE_TAG: ["ubuntu-24.04"]
        TOOLS: *standalone_tools
      - USER: [hgm]
        IMAGE: ["debian:13"]
        IMAGE_TAG: ["debian-13"]
        TOOLS: *standalone_tools
      - USER: [opt]
        IMAGE: ["ubuntu:24.04"]
        IMAGE_TAG: ["ubuntu-24.04"]
        TOOLS: *standalone_tools

# 2. Dependent tools (start as soon as their prerequisite finishes for the same USER/IMAGE)
build_nextpnr:
  extends: .build_tool_template
  parallel:
    matrix: *target_matrix
  needs:
    - job: build_standalone
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
            TOOLS: ["icestorm"]
  variables:
    TOOLS: "nextpnr"

build_formal:
  extends: .build_tool_template
  parallel:
    matrix: *target_matrix
  needs:
    - job: build_standalone
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
            TOOLS: ["yosys"]
  variables:
    TOOLS: "SymbiYosys eqy"

build_ghdl_yosys_plugin:
  extends: .build_tool_template
  parallel:
    matrix: *target_matrix
  needs:
    - job: build_standalone
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
            TOOLS: ["ghdl", "yosys"]
  variables:
    TOOLS: "ghdl-yosys-plugin"

# 3. Package stage: merges fosshdl/ from all tool jobs into the final tarball
.package_template:
  stage: package
  image: $CI_REGISTRY_IMAGE/builder:$IMAGE_TAG
  parallel:
    matrix: *target_matrix
  needs:
    - job: build_standalone
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
            TOOLS: *standalone_tools
    - job: build_nextpnr
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
    - job: build_formal
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
    - job: build_ghdl_yosys_plugin
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
  script:
    - |
      if [[ "$IS_WEEKLY" == "true" ]]; then
        cp "config-weekly-$USER.mk" config.mk
      else
        cp "config-$USER.mk" config.mk
      fi
    - cat fosshdl/versions-*.log | sort -u > fosshdl/versions.log
    - rm -f fosshdl/versions-*.log
    - cp config.mk fosshdl/config.mk
    # Archive $CI_PROJECT_DIR/fosshdl directly so tar stores real files, not a symlink
    - tar czf "fosshdl-$IMAGE-$USER-$CI_PIPELINE_CREATED_AT.tar.gz" -C "$CI_PROJECT_DIR" fosshdl
  artifacts:
    paths:
      - fosshdl-$IMAGE-$USER-$CI_PIPELINE_CREATED_AT.tar.gz

package:
  extends: .package_template
  artifacts:
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $IS_WEEKLY != "true"

package_weekly:
  extends: .package_template
  artifacts:
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $IS_WEEKLY == "true"
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# 4. Make the docker image in a separate stage
# Since it's in a separate stage we can't use the "make dockerfile" target
# because that would rebuild everything (because of dependencies in the
# Makefile), so we will just invoke docker. We also want to tag specifically
# the image so it can be pushed to gitlab's container registry
#
# The image has the same tag as its branch unless we are in the weekly build:
# in that case it is tagged 'weekly', but it will come from the 'master' branch
dockerimages:
  stage: dockerize
  image: docker:25
  timeout: 2 hours
  parallel:
    matrix:
      - USER: [salas]
        IMAGE: ["ubuntu:24.04"]
        IMAGE_TAG: ["ubuntu-24.04"]
  needs:
    - job: package
      optional: true
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
    - job: package_weekly
      optional: true
      parallel:
        matrix:
          - USER: ['$[[ matrix.USER ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']
  # If we add more than one possibility in the parallel:matrix, then we will
  # have to include that information into the tag
            IMAGE_TAG: ['$[[ matrix.IMAGE_TAG ]]']
  script:
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        tag=""
        echo "Running on default branch '$CI_DEFAULT_BRANCH': tag = 'latest'"
      else
        tag=":$CI_COMMIT_REF_SLUG"
        echo "Running on branch '$CI_COMMIT_BRANCH': tag = $tag"
      fi
    - |
      if [[ "$IS_WEEKLY" == "true" ]]; then
        tag=":weekly"
        echo "Hmm, we are in the weekly build: tag = $tag"
      fi
    - mv fosshdl-$IMAGE-$USER-$CI_PIPELINE_CREATED_AT.tar.gz fosshdl.tar.gz
    - docker build --pull -t "$CI_REGISTRY_IMAGE${tag}" .
    - |
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE${tag}"
